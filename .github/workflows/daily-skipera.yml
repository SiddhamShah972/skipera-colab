name: Daily Skipera

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-daily-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Skipera
        run: python -m pip install .

      - name: Process one module per enrolled course
        env:
          COURSERA_CAUTH: ${{ secrets.COURSERA_CAUTH }}
        run: skipera --daily
